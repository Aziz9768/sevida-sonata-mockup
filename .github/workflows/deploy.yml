name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sevida-ui/package-lock.json
            sevida-mockup/package-lock.json
      # The mockup reads the component library from ../sevida-ui/src, and the fonts come from its node_modules.
      - run: npm ci
        working-directory: sevida-ui
      - run: npm ci
        working-directory: sevida-mockup
      - run: npm run build
        working-directory: sevida-mockup
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sevida-mockup/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
